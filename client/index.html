<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover + no user scaling makes it feel like a native game on phones -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#1b1b2f" />
    <!-- iOS: allow installing to the home screen as a fullscreen app -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Monster Mash" />
    <title>Monster Mash</title>
  </head>
  <body>
    <!-- The lobby: pick a name + room code, then join. Plain HTML so the text
         inputs behave nicely on mobile keyboards. -->
    <div id="lobby">
      <div class="panel">
        <h1>Monster Mash</h1>
        <p class="tagline">Showdown brawl — last monster standing wins.</p>

        <label>
          Your name
          <input id="name" type="text" maxlength="16" placeholder="Player" autocomplete="off" />
        </label>

        <label>
          Pick your monster
          <!-- Filled in by main.ts from the shared monster list. Tap to choose. -->
          <div id="monsters" class="monsters"></div>
        </label>

        <label>
          Room code
          <div class="row">
            <input
              id="code"
              type="text"
              maxlength="6"
              placeholder="ABC1"
              autocapitalize="characters"
              autocomplete="off"
            />
            <button id="generate" type="button" title="Make a new code">🎲</button>
            <button id="copy-link" type="button" title="Copy a shareable link">🔗</button>
          </div>
        </label>

        <button id="join" class="primary">Join arena</button>
        <p id="error" class="error"></p>
      </div>
    </div>

    <!-- The Phaser game canvas mounts inside here once you join. -->
    <div id="game"></div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
